// =============================================
// MICROBIOLOGY EXPANSION - EXPERIMENT DEFINITION
// =============================================

// Defines the microbiologySample experiment so KSP's R&D system
// recognises it in the science archive and recovery screens.

EXPERIMENT_DEFINITION
{
    id = microbiologySample
    title = Microbe Sample Collection
    baseValue = 25
    scienceCap = 50
    dataScale = 1
    requireAtmosphere = False
    situationMask = 63      // SrfLanded(1)+SrfSplashed(8)+FlyingLow(2)+FlyingHigh(4)+InSpaceLow(16)+InSpaceHigh(32)
    biomeMask = 63          // biome-specific for all situations

    RESULTS
    {
        default = A carefully sealed sample of microbial life, collected by a Kerbal scientist.
        KerbinSrfLandedGrasslands = Grassland microorganisms, sealed and ready for lab analysis.
        KerbinSrfLandedShores = Coastal microbes collected from the shoreline sediment.
        KerbinSrfLandedWater = Aquatic microbes sampled from Kerbin's oceans.
        KerbinSrfLandedDesert = Hardy desert microorganisms, surviving in extreme aridity.
        KerbinSrfLandedHighlands = Highland microbes, adapted to thin air and rocky soil.
        KerbinSrfLandedMountains = Mountain microbes, pressure-tolerant and resilient.
        KerbinSrfLandedTundra = Tundra psychrophiles, thriving in freezing conditions.
        KerbinSrfLandedBadlands = Badlands extremophiles, surviving on mineral-rich compounds.
        KerbinSrfLandedMountains = Mountain microbes, pressure-tolerant and resilient.
        KerbinSrfLandedGrasslands = Grassland microorganisms, sealed and ready for lab analysis.
        DunaSrfLanded = Duna surface microbes — a remarkable find on the red planet.
        EveSrfLanded = Eve microbes, somehow surviving the crushing pressure and acid.
        LaytheSrfLanded = Laythe ocean microbes, sealed in an airtight collection vial.
        MunSrfLanded = Mun regolith microbes — endolithic survivors in the rock.
        MinmusSrfLanded = Minmus microbes, found in the frozen flats.
        DresSrfLanded = Dres canyon microbes — a discovery from the forgotten world.
        EelooSrfLanded = Eeloo cryophiles, metabolising at near-absolute-zero temperatures.
        TyloSrfLanded = Tylo microbes — handle with extreme caution.
        default_FlyingLow = Airborne microorganisms collected during low-altitude flight.
        default_FlyingHigh = High-altitude microbial spores, captured during upper atmospheric transit.
        default_InSpaceLow = Microorganisms detected in low orbit — remarkable survivability.
        default_InSpaceHigh = Deep space microbial signatures. How did they get here?
        JoolFlyingLow = Jool atmospheric microbes, collected during low-altitude atmospheric flight.
        JoolFlyingHigh = Upper atmosphere Jool microbes, collected at high altitude.
        LaytheFlyingLow = Laythe low-altitude airborne microbes, collected in flight.
        EveFlyingLow = Eve atmospheric microbes — surprisingly resilient to acid exposure.
    }
}

// =============================================
// MODULE MANAGER PATCH
// Adds MicroSampleCollector to ALL EVA kerbal variants.
// Uses kerbalEVA* wildcard to catch base suits, slim suits,
// vintage suits (Making History), and future suits (Serenity).
// The EVA part already has ModuleScienceContainer so our
// samples integrate with the stock science UI automatically.
// =============================================

@PART[kerbalEVA*]:HAS[@MODULE[KerbalEVA]]:NEEDS[MicrobiologyExpansion]
{
    MODULE
    {
        name = MicroSampleCollector
    }
}

// =============================================
// SCIENCE CONTAINER CAPACITY PATCHES
// Allows ESU and ERU to store 5 microbe samples each.
// EVA kerbal keeps stock default capacity of 1 sample.
// =============================================

// Experiment Storage Unit (Breaking Ground DLC)
@PART[ScienceBox]:NEEDS[MicrobiologyExpansion]
{
    @MODULE[ModuleScienceContainer]
    {
        @storageRange = 2.0
        @evaOnlyStorage = False
        allowRepeatedSubjects = True
    }
}

// Experiment Return Unit (Breaking Ground DLC)  
@PART[ScienceContainerSmall]:NEEDS[MicrobiologyExpansion]
{
    @MODULE[ModuleScienceContainer]
    {
        @storageRange = 2.0
        @evaOnlyStorage = False
        allowRepeatedSubjects = True
    }
}

// =============================================
// MOBILE PROCESSING LAB CAPACITY PATCH
// Allows the MPL to store up to 10 microbe samples.
// =============================================

@PART[Large_Crewed_Lab]:NEEDS[MicrobiologyExpansion]
{
    @MODULE[ModuleScienceContainer]
    {
        @storageRange = 3.0
        @evaOnlyStorage = False
        allowRepeatedSubjects = True
    }
}

// =============================================
// MOBILE PROCESSING LAB — MicroLabProcessor PATCH
// Adds the processor module to the stock MPL.
// =============================================

@PART[Large_Crewed_Lab]:NEEDS[MicrobiologyExpansion]:AFTER[MicrobiologyExpansion]
{
    MODULE
    {
        name = MicroLabProcessor
    }
}