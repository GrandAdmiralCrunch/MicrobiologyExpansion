// =============================================
// MICROBIOLOGY EXPANSION — KERBAL EXPERIENCE
// Defines custom flight log entry types for
// microbe discoveries. KSP uses these to award
// experience points to the discovering kerbal.
// =============================================

// Safe microbe discovery — 1 XP
EXPERIENCE_LOG_ENTRY
{
    type = MicrobologySafeDiscovery
    description = Discovered a safe microbial specimen
    xp = 1
}

// Risky microbe discovery — 5 XP
EXPERIENCE_LOG_ENTRY
{
    type = MicrobiologyRiskyDiscovery
    description = Discovered a risky microbial specimen
    xp = 5
}

// Hazardous microbe discovery — 10 XP
EXPERIENCE_LOG_ENTRY
{
    type = MicrobiologyHazardousDiscovery
    description = Identified a hazardous biosignature
    xp = 10
}