// ---------------------------------------------
// MICROBE DEFINITIONS
//
// Fields:
//   name             unique display name (also used by trophicRelations)
//   category         Bacteria, Archaea, Fungi, Protist, Parasite, Virus,
//                    Symbiote, Metazoa, Fossil, Debris, Unknown
//   homePlanet       CelestialBody name (e.g. Kerbin, Laythe, Sun)
//   biomes           comma list of biome names, or Any
//   situation        Surface, InFlight, InSpace or Any
//   hazardLevel      Safe, Risky or Hazardous (case-sensitive key!)
//   spawnChance      relative weight when several microbes are eligible
//   scienceValue     base science (x1.5 Risky, x3 Hazardous)
//   trophicRelations comma list of microbes this one CONSUMES (prey,
//                    hosts or digested remains). Each pair is revealed in
//                    the Codex once both species are lab-processed.
//   flavorText       Codex description (single line)
//   icon             texture path without extension
// ---------------------------------------------

MICROBE
{
	name = CyanoBacteri Kerbinii
	category = Bacteria
	homePlanet = Kerbin
	biomes = Water,Shores
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.75
	scienceValue = 3
	flavorText = Oxygen-producing cyanobacteria that drink in dissolved carbon dioxide and sunlight across Kerbin's oceans. Almost every breath a Kerbal takes was once a bubble from one of these, which makes them the true foundation of Kerbin's food web. Grazed on by nearly everything with a mouth, a pseudopod, or an opinion.
	icon = MicrobiologyExpansion/Icons/CyanoBacteri_Kerbinii
}

MICROBE
{
	name = Xenothermus Kerbinii
	category = Bacteria
	homePlanet = Kerbin
	biomes = Water
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.45
	scienceValue = 7
	flavorText = Aquatic heat-loving bacteria that cluster around warm seafloor seeps and sun-baked tide pools. Its heat-stable enzymes keep working long after the lab's water bath has been turned up too far, which the KSC cafeteria has started using to keep the snacks warm.
	icon = MicrobiologyExpansion/Icons/Xenothermus_Kerbinii
}

MICROBE
{
	name = Radiodurans Kerbinii
	category = Bacteria
	homePlanet = Kerbin
	biomes = Ice Caps,Northern Ice Shelf,Southern Ice Shelf
	situation = InFlight
	hazardLevel = Safe
	spawnChance = 0.08
	scienceValue = 20
	flavorText = Radiation-resistant bacteria that ride updrafts above Kerbin's polar ice and survive in the thin, UV-scoured upper atmosphere. Carries multiple copies of its genome and stitches shattered DNA back together overnight. Our best candidate for an organism that could survive a trip on a rocket without a capsule.
	icon = MicrobiologyExpansion/Icons/Radiodurans_Kerbinii
}

MICROBE
{
	name = Aridbacter Kerbinii
	category = Bacteria
	homePlanet = Kerbin
	biomes = Deserts
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.60
	scienceValue = 4
	trophicRelations = Erosioarchaea Kerbinii
	flavorText = Desert biome bacteria that sit dormant in the sand for years, then bloom within hours of rain. It scavenges the minerals Erosioarchaea frees from the rock, so finding one usually means the other is nearby. Bob said it tastes like sprinkles.
	icon = MicrobiologyExpansion/Icons/Aridbacter_Kerbinii
}

MICROBE
{
	name = Hydrotalis Kerbinoa
	category = Bacteria
	homePlanet = Kerbin
	biomes = Water,Shores
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.70
	scienceValue = 6
	trophicRelations = CyanoBacteri Kerbinii
	flavorText = A fast, comma-shaped predatory bacterium found in Kerbin's water. It drills into cyanobacteria cells, eats them from the inside, and divides into a dozen new hunters. Small, but Kerbin's oceans would be much greener without it.
	icon = MicrobiologyExpansion/Icons/Hydrotalis_Kerbinoa
}

MICROBE
{
	name = Bryozoa Kerbinoa
	category = Metazoa
	homePlanet = Kerbin
	biomes = Water
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.50
	scienceValue = 5
	trophicRelations = Diatomus Kerbinii, CyanoBacteri Kerbinii, Paramecia Kerbinii
	flavorText = Ocean-dwelling colonial zooids that build lacy, coral-like mats on rocks and old boat hulls. Each tiny animal extends a crown of tentacles to filter diatoms and protists out of the water. Several have been found growing on recovered splashdown capsules, which Wernher considers a compliment.
	icon = MicrobiologyExpansion/Icons/Bryozoa_Kerbinoa
}

MICROBE
{
	name = Diatomus Kerbinii
	category = Protist
	homePlanet = Kerbin
	biomes = Water
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.60
	scienceValue = 3
	flavorText = Ocean-dwelling oxygen producer living inside an intricate two-part glass shell. When they die, their shells rain down and pile up as fine white sediment, which KSC uses as a polishing powder for the observatory telescope. A favorite food of filter feeders across the coast.
	icon = MicrobiologyExpansion/Icons/Diatomus_Kerbinii
}

MICROBE
{
	name = Red-Headed Bristleworm
	category = Metazoa
	homePlanet = Kerbin
	biomes = Grasslands,Highlands,Badlands,Shores,Water
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.30
	scienceValue = 8
	trophicRelations = Biofilmix Kerbinii, Diatomus Kerbinii, Heterovora Kerbinii
	flavorText = A microscopic worm with far too many legs and a distinct red head, crawling through wet soil, beach sand and shallow water. It grazes biofilms and diatoms and hunts slower protists, and is in turn hunted by tardigrades and parasitized by tapeworm larvae. Nobody has been able to count all of the legs.
	icon = MicrobiologyExpansion/Icons/Bristleworm_Kerbinii
}

MICROBE
{
	name = Symbiota Kerbalota
	category = Symbiote
	homePlanet = Kerbin
	biomes = Any
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.40
	scienceValue = 5
	trophicRelations = Helicobacter Kerbinii
	flavorText = A friendly symbiote that lives in Kerbal digestive tracts and Kerbin's waterways. It helps Kerbals digest snacks and actively crowds out and digests stomach pathogens such as Helicobacter. Kerbals with a healthy Symbiota population report better moods and fewer launch-day stomach aches.
	icon = MicrobiologyExpansion/Icons/Symbiota_Kerbalota
}

MICROBE
{
	name = Ferroplasma Kerbinii
	category = Archaea
	homePlanet = Kerbin
	biomes = Badlands
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.50
	scienceValue = 8
	flavorText = A wall-less archaeon found subsisting on the iron-rich compounds of the Badlands. It oxidizes iron sulfide for energy and turns its surroundings into acid runoff, which is partly why the Badlands are so red. Too acidic to be eaten by most of its neighbors.
	icon = MicrobiologyExpansion/Icons/Ferroplasma_Kerbinii
}

MICROBE
{
	name = Carboxydothermus Kerbinensis
	category = Archaea
	homePlanet = Kerbin
	biomes = Badlands
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.50
	scienceValue = 8
	flavorText = A heat-loving anaerobe that consumes carbon monoxide and converts it into hydrogen and carbon dioxide. Found in hot volcanic soils of the Badlands. Engineers are already wondering whether it could be grown in a rocket exhaust scrubber.
	icon = MicrobiologyExpansion/Icons/Carboxydothermus_Kerbinensis
}

MICROBE
{
	name = Erosioarchaea Kerbinii
	category = Archaea
	homePlanet = Kerbin
	biomes = Badlands,Deserts
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.45
	scienceValue = 9
	flavorText = Rock-eroding archaea that secrete acid into tiny cracks, slowly dissolving stone into sand. Over geologic time they are responsible for a surprising amount of Kerbin's desert. Their leftovers are the main food source for desert bacteria like Aridbacter.
	icon = MicrobiologyExpansion/Icons/Erosioarchaea_Kerbinii
}

MICROBE
{
	name = Mycorrhiza Kerbinii
	category = Fungi
	homePlanet = Kerbin
	biomes = Grasslands,Highlands
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.48
	scienceValue = 4
	flavorText = A fungus that forms vast underground networks with Kerbin's grasses and shrubs, trading minerals for sugar. A single network can stretch for kilometers beneath the grasslands around KSC, and it probably knows about the launch schedule before we do.
	icon = MicrobiologyExpansion/Icons/Mycorrhiza_Kerbinii
}

MICROBE
{
	name = Aeromicrobi Kerbinii
	category = Bacteria
	homePlanet = Kerbin
	biomes = Any
	situation = InFlight
	hazardLevel = Safe
	spawnChance = 0.30
	scienceValue = 10
	flavorText = An airborne microbe that lives inside high-altitude clouds, feeding on organic dust and seeding ice crystals. Large blooms can tint snowflakes pink, green or orange, producing a rare phenomenon known as colorful "Kerbin snow".
	icon = MicrobiologyExpansion/Icons/Aeromicrobi_Kerbinii
}

MICROBE
{
	name = Cryohelix Kerbinii
	category = Protist
	homePlanet = Kerbin
	biomes = Tundra
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.45
	scienceValue = 8
	trophicRelations = Nitrosomonas Kerbinii, Biofilmix Kerbinii, Cryospora Kerbinii
	flavorText = A spiral-shaped, cold-loving protist that corkscrews slowly through tundra meltwater. It grazes on bacteria, biofilms and snow fungi at temperatures that would freeze most other cells solid. Moves at roughly the speed of a Kerbal reading a contract.
	icon = MicrobiologyExpansion/Icons/Cryohelix_Kerbinii
}

MICROBE
{
	name = Barophilus Kerbinii
	category = Bacteria
	homePlanet = Kerbin
	biomes = Mountains
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.48
	scienceValue = 10
	flavorText = A pressure-tolerant bacterium adapted to the thin air and wild temperature swings of Kerbin's high peaks. Its thick cell wall flexes rather than bursts, making it remarkably hard to kill. A favorite snack of the parasitic Parasitox.
	icon = MicrobiologyExpansion/Icons/Barophilus_Kerbinii
}

MICROBE
{
	name = Fungii Kerbinii
	category = Fungi
	homePlanet = Kerbin
	biomes = Grasslands,Highlands
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.65
	scienceValue = 3
	trophicRelations = Red-Headed Bristleworm
	flavorText = A decomposer that breaks down dead leaves, wood and the occasional unlucky worm on forest floors. Its mycelial networks recycle nutrients rapidly and are the main reason the grasslands never pile up with debris. The tardigrades think it is delicious.
	icon = MicrobiologyExpansion/Icons/Fungii_Kerbinii
}

MICROBE
{
	name = Nitrosomonas Kerbinii
	category = Bacteria
	homePlanet = Kerbin
	biomes = Any
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.50
	scienceValue = 2
	flavorText = An ammonia-oxidizing (nitrifying) bacterium found almost everywhere on Kerbin. It turns ammonia from decaying matter into nitrite, a key step in the nitrogen cycle. Unglamorous, essential, and eaten by nearly everyone.
	icon = MicrobiologyExpansion/Icons/Nitrosomonas_Kerbinii
}

MICROBE
{
	name = Methanogenus Kerbinii
	category = Archaea
	homePlanet = Kerbin
	biomes = Water,Shores
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.45
	scienceValue = 5
	flavorText = An anaerobic methanogen that produces methane in oxygen-poor sediments, swamps, and Kerbal waste tanks. Responsible for most of the smell in the Mk1 capsule after a long mission. Engineers have noted that the methane could, in theory, be used as fuel.
	icon = MicrobiologyExpansion/Icons/Methanogenus_Kerbinii
}

MICROBE
{
	name = Biofilmix Kerbinii
	category = Bacteria
	homePlanet = Kerbin
	biomes = Any
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.55
	scienceValue = 6
	flavorText = A surface biofilm former that coats rocks, leaves and spacecraft in a protective layer of slime. Once established, the slime is very hard to clean, and it has been found growing on the outside of the VAB doors. Grazed by worms and protists alike.
	icon = MicrobiologyExpansion/Icons/Biofilmix_Kerbinii
}

MICROBE
{
	name = Cryospora Kerbinii
	category = Fungi
	homePlanet = Kerbin
	biomes = Northern Ice Shelf,Ice Caps,Tundra,Southern Ice Shelf
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.50
	scienceValue = 10
	flavorText = A cold-loving snow and ice fungus that grows in polar ice and tundra. Its dark pigments absorb sunlight to melt tiny pockets of water around itself. Polar expeditions report that it gives old snow a faint mushroomy smell.
	icon = MicrobiologyExpansion/Icons/Cryospora_Kerbinii
}

MICROBE
{
	name = Geolithus Kerbinii
	category = Archaea
	homePlanet = Kerbin
	biomes = Highlands,Mountains
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.40
	scienceValue = 12
	flavorText = A rock-weathering chemolithotroph that is the first pioneer to colonize bare rock after a landslide or eruption. It slowly etches minerals for energy, laying down the first thin crust of soil that other life can build on.
	icon = MicrobiologyExpansion/Icons/Geolithus_Kerbinii
}

MICROBE
{
	name = Parasitox Kerbinii
	category = Parasite
	homePlanet = Kerbin
	biomes = Any
	situation = Surface
	hazardLevel = Risky
	spawnChance = 0.25
	scienceValue = 10
	trophicRelations = Biofilmix Kerbinii, Nitrosomonas Kerbinii, Barophilus Kerbinii, CyanoBacteri Kerbinii
	flavorText = An intracellular parasite of bacteria. It slips inside a host cell, hijacks its machinery, and bursts out as dozens of new parasites. It plays an important role in keeping bacterial blooms in check, but nobody wants to find out whether it can learn to infect bigger things.
	icon = MicrobiologyExpansion/Icons/Parasitox_Kerbinii
}

MICROBE
{
	name = Krakenovirinae Kerbinii
	category = Virus
	homePlanet = Kerbin
	biomes = Any
	situation = Surface
	hazardLevel = Hazardous
	spawnChance = 0.02
	scienceValue = 30
	trophicRelations = Symbiota Kerbalota
	flavorText = A virus that likely causes the dreaded disease Krakenitis. It wipes out the gut's friendly Symbiota first, then moves on to the Kerbal. Handle with caution. Wernher von Kerman says some ice cream from Minmus may help if you get sick.
	icon = MicrobiologyExpansion/Icons/Krakenovirinae_Kerbinii
}

MICROBE
{
	name = Heterovora Kerbinii
	category = Protist
	homePlanet = Kerbin
	biomes = Water,Shores
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.35
	scienceValue = 6
	trophicRelations = CyanoBacteri Kerbinii, Nitrosomonas Kerbinii, Paramecia Kerbinii, Euglena Kerbinii
	flavorText = A heterotrophic protist that grazes on bacteria and smaller protists in freshwater and coastal zones. Engulfs its prey whole, then wanders off looking for more. Its feeding keeps Kerbin's coastal waters from turning into green soup.
	icon = MicrobiologyExpansion/Icons/Heterovora_Kerbinii
}

MICROBE
{
	name = Tardigradium Kerbinii
	category = Metazoa
	homePlanet = Kerbin
	biomes = Any
	situation = Any
	hazardLevel = Safe
	spawnChance = 0.18
	scienceValue = 6
	trophicRelations = Fungii Kerbinii, Diatomus Kerbinii, Red-Headed Bristleworm
	flavorText = Can be found anywhere, and survives pressures and temperatures beyond any other microbe on Kerbin, including a short trip to space. When things get bad, it curls up into a dried-out barrel and waits. Eats fungi, diatoms and worms, and looks adorable doing it.
	icon = MicrobiologyExpansion/Icons/Tardigradium_Kerbinii
}

MICROBE
{
	name = Cryovorum Dunae
	category = Bacteria
	homePlanet = Duna
	biomes = Polar Highlands,Polar Craters,Poles
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.30
	scienceValue = 30
	flavorText = Lives in Duna's polar ice caps. A mostly dormant bacterium with extremely long life cycles, waking only during the brief polar summer to divide once and go back to sleep. Some cells may be older than the KSC itself.
	icon = MicrobiologyExpansion/Icons/Cryovorum_Dunae
}

MICROBE
{
	name = Dunaevora Frigidum
	category = Archaea
	homePlanet = Duna
	biomes = Any
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.12
	scienceValue = 28
	flavorText = An archaeon that feeds on the iron-rich dust of Duna. Hard to find, but found everywhere, carried across the planet by the global dust storms. A likely food source for Duna's few predators.
	icon = MicrobiologyExpansion/Icons/Dunaevora_Frigidum
}

MICROBE
{
	name = Perchlorovore Dunae
	category = Bacteria
	homePlanet = Duna
	biomes = Western Canyon
	situation = Surface
	hazardLevel = Risky
	spawnChance = 0.28
	scienceValue = 28
	flavorText = A perchlorate-reducing bacterium that uses the toxic perchlorates in Duna's soil as an electron acceptor, breathing what would poison almost anything else. Its waste is oxygen, which makes it of great interest to the life support department.
	icon = MicrobiologyExpansion/Icons/Perchlorovore_Dunae
}

MICROBE
{
	name = Polyextrema Eveia
	category = Bacteria
	homePlanet = Eve
	biomes = Explodium Sea,Shallows
	situation = Surface
	hazardLevel = Risky
	spawnChance = 0.08
	scienceValue = 55
	flavorText = Exists in Eve's Explodium seas. Our scientists still do not understand how it survives, or why it hasn't exploded. Extremely difficult to find, and the samples have a habit of making the lab equipment nervous.
	icon = MicrobiologyExpansion/Icons/Polyextrema_Eveia
}

MICROBE
{
	name = Acidivorax Eveia
	category = Bacteria
	homePlanet = Eve
	biomes = Western Sea
	situation = Surface
	hazardLevel = Risky
	spawnChance = 0.25
	scienceValue = 34
	trophicRelations = Xenocyanin Eveia
	flavorText = A bacterium that feeds on acidic compounds in Eve's seas. It also scavenges the dead pigmented cells of Xenocyanin that rain down from the hazy atmosphere above. Corrosive enough that samples must be stored in glass, not steel.
	icon = MicrobiologyExpansion/Icons/Acidivorax_Eveia
}

MICROBE
{
	name = Xenocyanin Eveia
	category = Bacteria
	homePlanet = Eve
	biomes = Any
	situation = InFlight
	hazardLevel = Risky
	spawnChance = 0.15
	scienceValue = 42
	flavorText = An acid-loving phototroph floating in Eve's thick, hazy atmosphere. It uses exotic purple pigments to harvest Eve's dim, filtered light. When it dies, it sinks to the seas below, feeding the scavengers there.
	icon = MicrobiologyExpansion/Icons/Xenocyanin_Eveia
}

MICROBE
{
	name = Methanoxus Sporum
	category = Fungi
	homePlanet = Jool
	biomes = Any
	situation = InFlight
	hazardLevel = Risky
	spawnChance = 0.18
	scienceValue = 95
	trophicRelations = Aerobacter Joolii
	flavorText = Fungal spores floating in Jool's atmosphere, feeding on the methane-rich air and the remains of dead bacteria. Difficult to find. Collecting a sample usually means flying dangerously deep into Jool.
	icon = MicrobiologyExpansion/Icons/Methanoxus_Sporum
}

MICROBE
{
	name = Aerobacter Joolii
	category = Bacteria
	homePlanet = Jool
	biomes = Any
	situation = InFlight
	hazardLevel = Safe
	spawnChance = 0.45
	scienceValue = 45
	flavorText = A bacterium found throughout Jool's atmosphere, drifting in the clouds and living off ammonia and methane. It is the base of the entire Joolian sky ecosystem, and almost everything up there eats it.
	icon = MicrobiologyExpansion/Icons/Aerobacter_Joolii
}

MICROBE
{
	name = Joolmoeba
	category = Protist
	homePlanet = Jool
	biomes = Any
	situation = InFlight
	hazardLevel = Risky
	spawnChance = 0.22
	scienceValue = 80
	trophicRelations = Aerobacter Joolii, Methanoxus Sporum, Chlorinivorax Tyloii
	flavorText = A giant amoeba that eats most other microbes and is found throughout Jool's atmosphere. It even consumes Chlorinivorax cells that were blasted off Tylo by impacts and fell into Jool's clouds. Keep your sample jars firmly closed.
	icon = MicrobiologyExpansion/Icons/Joolmoeba
}

MICROBE
{
	name = Photocyanus Laythensis
	category = Bacteria
	homePlanet = Laythe
	biomes = Shallows
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.80
	scienceValue = 40
	flavorText = A cyanobacteria-like oxygen producer in Laythe's sunlit shallows. Not a significant source of oxygen for Laythe's atmosphere, but it feeds nearly every other microbe in the shallows. Its blooms tint the shallow lagoons a faint teal.
	icon = MicrobiologyExpansion/Icons/Photocyanus_Laythensis
}

MICROBE
{
	name = Thalassobacter Laythensis
	category = Bacteria
	homePlanet = Laythe
	biomes = Degrasse Sea
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.65
	scienceValue = 45
	trophicRelations = Photocyanus Laythensis, Snow Algae
	flavorText = A marine heterotroph that decomposes organic matter in Laythe's coastal seas. It breaks down dead phototroph cells and algae, recycling their nutrients back into the water. Laythe's oceans would quickly choke on debris without it.
	icon = MicrobiologyExpansion/Icons/Thalassobacter_Laythensis
}

MICROBE
{
	name = Flagellatus Laythensis
	category = Protist
	homePlanet = Laythe
	biomes = Shallows
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.55
	scienceValue = 60
	trophicRelations = Photocyanus Laythensis, Thalassobacter Laythensis, Sulfurox Laythensis, Planktarchae Laythensis
	flavorText = A motile, eukaryote-like microbe that uses a long whip of a flagellum to hunt bacteria in Laythe's shallows. Fast, hungry and surprisingly curious, it has been seen following the lights of lander probes.
}

MICROBE
{
	name = Planktarchae Laythensis
	category = Archaea
	homePlanet = Laythe
	biomes = Shallows,The Sagen Sea,Degrasse Sea
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.50
	scienceValue = 56
	flavorText = A planktonic archaeon drifting in the upper layers of Laythe's oceans, contributing to nitrogen cycling. Small, numerous and quiet, it is the most common cell in any scoop of Laythe seawater.
	icon = MicrobiologyExpansion/Icons/Planktarchae_Laythensis
}

MICROBE
{
	name = Radiotolerans Laythensis
	category = Bacteria
	homePlanet = Laythe
	biomes = Any
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.60
	scienceValue = 75
	flavorText = Radiation- and cold-resistant bacteria found across Laythe's surface. Combines aggressive DNA repair with dark pigments that shield it from Jool's intense radiation belts. A favorite food of the larger Laythe fungi.
	icon = MicrobiologyExpansion/Icons/Radiotolerans_Laythensis
}

MICROBE
{
	name = Laythvirii Laythensis
	category = Virus
	homePlanet = Laythe
	biomes = Any
	situation = Surface
	hazardLevel = Risky
	spawnChance = 0.20
	scienceValue = 65
	trophicRelations = Photocyanus Laythensis
	flavorText = A bacteriophage that infects common photosynthetic bacteria in Laythe's waters. Its outbreaks can wipe out a phototroph bloom in days, briefly turning the lagoons clear. Scientists are fascinated by how similar it is to viruses on Kerbin.
	icon = MicrobiologyExpansion/Icons/Laythvirii_Laythensis
}

MICROBE
{
	name = Ventarchae Laythensis
	category = Archaea
	homePlanet = Laythe
	biomes = The Sagen Sea,Degrasse Sea
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.35
	scienceValue = 58
	flavorText = A hyperthermophilic chemolithotroph that lives around hydrothermal vents deep beneath Laythe's seas. It draws energy from sulfur and hydrogen bubbling up from the rock, and needs no sunlight at all. The strongest hint yet that Laythe's core is still warm.
	icon = MicrobiologyExpansion/Icons/Ventarchae_Laythensis
}

MICROBE
{
	name = Deepanaero Laythensis
	category = Bacteria
	homePlanet = Laythe
	biomes = Poles,Peaks
	situation = Surface
	hazardLevel = Safe
	spawnChance = 0.40
	scienceValue = 52
	trophicRelations = Ventarchae Laythensis
	flavorText = An anaerobic heterotroph found in oxygen-poor sediments around Laythe's poles and peaks. It thrives where nothing else can breathe, slowly fermenting buried organic matter and the dead vent archaea that drift down into the sediment. Smells terrible.
	icon = MicrobiologyExpansion/Icons/Deepanaero_Laythensis
}

MICROBE
{
	name = Nitrofixus Laythensis
	category = Symbiote
	homePlanet = Laythe
	biomes = The Sagen Sea,Degrasse Sea,Shallows
	situation = Any
	hazardLevel = Safe
