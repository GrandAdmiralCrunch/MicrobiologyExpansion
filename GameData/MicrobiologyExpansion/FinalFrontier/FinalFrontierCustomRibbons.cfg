# Final Frontier ribbon pack for Microbiology Expansion.
# Format read by Final Frontier (Nereid/FinalFrontier, RibbonPack.cs):
#   NAME:<pack name>  FOLDER:<ribbon folder, relative to this file>  BASE:<added to every id>
#   <id>:<file without .png>:<name>:<description>:<prestige>
# A ':' inside a name or description breaks the line, so there is none.
# BASE 8300 keeps the ids clear of STM's packs (8100-8155).

NAME:Microbiology Expansion
FOLDER:Ribbons
BASE:8300
# Lines starting with '#<id>:' have no image in 0.2.0 yet; remove the '#' once the .png exists.

1:ribbon_first_life:First Biosignature:Detected the very first microbial biosignature in Kerbalkind's history. This changes everything.:5
2:ribbon_first_kerbin:First Kerbin Life Detected:First to confirm microbial life in Kerbin's biosphere using proper scientific instruments. (It was already assumed, but now there's paperwork.):1
3:ribbon_first_mun:First Mun Life Detected:Something is clinging to life in the Mun's regolith. Bob is trying very hard not to seem excited.:3
4:ribbon_first_minmus:First Minmus Life Detected:Microbes confirmed in the ice flats of Minmus. Wernher says they taste like ice cream. He has been told to stop licking samples.:3
5:ribbon_first_duna:First Duna Life Detected:Against all odds, Duna's frozen, irradiated surface harbours microbial survivors.:4
6:ribbon_first_eve:First Eve Life Detected:Life clings to existence even in Eve's corrosive seas and crushing atmosphere.:4
7:ribbon_first_laythe:First Laythe Life Detected:First confirmed biosignature from Laythe. Jool's ocean moon is alive.:4
8:ribbon_first_dres:First Dres Life Detected:The forgotten planet isn't so dead after all. Microbes have been eking out an existence in the canyon walls.:4
#9:ribbon_first_jool:First Jool Life Detected:Microbial life confirmed in the clouds of Jool. The gas giant is no longer silent.:5
#10:ribbon_first_eeloo:First Eeloo Life Detected:Something metabolises tholins at the very edge of the solar system. Life finds a way — even out here.:5
#11:ribbon_first_tylo:First Tylo Life Detected:Chlorine-spewing archaea confirmed in Tylo's craters. Classified Hazardous immediately upon discovery.:5
12:ribbon_microbiologist:Microbiologist:Discovered 10 distinct microbial species. Science is progressing rapidly.:3
13:ribbon_exobiologist:Exobiologist:First microbial discovery beyond Kerbin. First contact with alien biology.:4
14:ribbon_astrobiologist:Astrobiologist:Discovered microbial life on 5 or more distinct worlds. Life is everywhere.:5
15:ribbon_jool_fisherman:Joolian Fisherman:Collected a microbial sample from the atmosphere of Jool. Most scientists are still arguing about whether atmospheric trawling counts as fishing.:4
#16:ribbon_milestone_25:Naturalist:25 distinct microbial species catalogued. The codex is filling up nicely.:3
#17:ribbon_milestone_50:Master Naturalist:Every known microbial species catalogued. Someone needs to write more grants.:5
#18:ribbon_all_bacteria:Bacteriologist:All known bacterial species catalogued. There are a lot of them. There are always a lot of them.:4
#19:ribbon_all_archaea:Archaeologist:All known archaeal species catalogued. Not the digging kind of archaeologist, but arguably more impressive.:4
#20:ribbon_all_fungi:Mycologist:All known fungal species catalogued. The mycelial network approves.:3
#21:ribbon_all_protists:Protistologist:All known protist species catalogued. Five species. That's still a title, apparently.:3
#22:ribbon_all_viruses:Virologist:Both known viral species catalogued. Gene transferred this ribbon to himself. No one is sure how.:4
#23:ribbon_all_symbiotes:Symbiologist:All known symbiotic species catalogued. They were already living inside us. We just finally noticed.:3
#24:ribbon_all_parasites:Parasitologist:All known parasitic species catalogued. The kerbal earning this ribbon is asked to please not bring samples home.:3
#25:ribbon_first_risky:Hazmat Initiate:First confirmed discovery of a Risky-class microorganism. Quarantine protocols have been updated accordingly.:3
#26:ribbon_first_hazardous:Hazmat Specialist:First confirmed discovery of a Hazardous-class microorganism. Mission Control would like a word. Several words, actually.:5
#27:ribbon_all_risky:Risk Assessor:All Risky-class microorganisms catalogued. The safety board has reviewed this kerbal's file. The file is very thick.:4
#28:ribbon_all_hazardous:Walking Biohazard:Both Hazardous-class microorganisms catalogued. This kerbal is no longer permitted within 50 metres of the cafeteria.:5
#29:ribbon_krakenitis:Patient Zero:Discovered Krakenovirinae Kerbinii — the probable cause of Krakenitis. Wernher recommends Minmus ice cream as a treatment. The medical board does not endorse this.:5
#30:ribbon_ice_cream:Connoisseur:Discovered Vacuuma Minmii — the bacterium Bob insists tastes like ice cream. The sample was recovered slightly licked.:2
#31:ribbon_chlorinivorax:Do Not Breathe:Discovered Chlorinivorax Tyloii. Toxic chlorine byproducts confirmed. The kerbal who found it has been placed in a very nice sealed room.:5
#32:ribbon_joolmoeba:Something Ate My Probe:Discovered Joolmoeba — the protist that preys on every other microbe in Jool's atmosphere. And apparently some of the probe hardware.:4
#33:ribbon_halite:Breakfast Seasoning:Discovered Halite Dresii. Valentina has already filed a patent application for Dres-brand table salt. Legal is looking into it.:3
#34:ribbon_lithosilicus:It's Definitely Not a Rock:Discovered Lithosilicus Dresii. Jeb remains unconvinced. The sample has been growing for three weeks.:3
