pack = Microbiology Expansion

name        = MicrobiologyExpansion_FirstLife
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_life
prestige    = 5
unique      = true
text        = First Biosignature
description = Detected the very first microbial biosignature in Kerbalkind's history. This changes everything.

name        = MicrobiologyExpansion_FirstLifeKerbin
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_kerbin
prestige    = 1
unique      = true
text        = First Kerbin Life Detected
description = First to confirm microbial life in Kerbin's biosphere using proper scientific instruments. (It was already assumed, but now there's paperwork.)

name        = MicrobiologyExpansion_FirstLifeMun
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_mun
prestige    = 3
unique      = true
text        = First Mun Life Detected
description = Something is clinging to life in the Mun's regolith. Bob is trying very hard not to seem excited.

name        = MicrobiologyExpansion_FirstLifeMinmus
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_minmus
prestige    = 3
unique      = true
text        = First Minmus Life Detected
description = Microbes confirmed in the ice flats of Minmus. Wernher says they taste like ice cream. He has been told to stop licking samples.

name        = MicrobiologyExpansion_FirstLifeDuna
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_duna
prestige    = 4
unique      = true
text        = First Duna Life Detected
description = Against all odds, Duna's frozen, irradiated surface harbours microbial survivors.

name        = MicrobiologyExpansion_FirstLifeEve
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_eve
prestige    = 4
unique      = true
text        = First Eve Life Detected
description = Life clings to existence even in Eve's corrosive seas and crushing atmosphere.

name        = MicrobiologyExpansion_FirstLifeLaythe
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_laythe
prestige    = 4
unique      = true
text        = First Laythe Life Detected
description = First confirmed biosignature from Laythe. Jool's ocean moon is alive.

name        = MicrobiologyExpansion_FirstLifeDres
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_dres
prestige    = 4
unique      = true
text        = First Dres Life Detected
description = The forgotten planet isn't so dead after all. Microbes have been eking out an existence in the canyon walls.

name        = MicrobiologyExpansion_FirstLifeJool
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_jool
prestige    = 5
unique      = true
text        = First Jool Life Detected
description = Microbial life confirmed in the clouds of Jool. The gas giant is no longer silent.

name        = MicrobiologyExpansion_FirstLifeEeloo
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_eeloo
prestige    = 5
unique      = true
text        = First Eeloo Life Detected
description = Something metabolises tholins at the very edge of the solar system. Life finds a way — even out here.

name        = MicrobiologyExpansion_FirstLifeTylo
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_tylo
prestige    = 5
unique      = true
text        = First Tylo Life Detected
description = Chlorine-spewing archaea confirmed in Tylo's craters. Classified Hazardous immediately upon discovery.

name        = MicrobiologyExpansion_Microbiologist
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_microbiologist
prestige    = 3
unique      = false
text        = Microbiologist
description = Discovered 10 distinct microbial species. Science is progressing rapidly.

name        = MicrobiologyExpansion_Exobiologist
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_exobiologist
prestige    = 4
unique      = false
text        = Exobiologist
description = First microbial discovery beyond Kerbin. First contact with alien biology.

name        = MicrobiologyExpansion_Astrobiologist
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_astrobiologist
prestige    = 5
unique      = false
text        = Astrobiologist
description = Discovered microbial life on 5 or more distinct worlds. Life is everywhere.

name        = MicrobiologyExpansion_JoolianFisherman
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_jool_fisherman
prestige    = 4
unique      = false
text        = Joolian Fisherman
description = Collected a microbial sample from the atmosphere of Jool. Most scientists are still arguing about whether atmospheric trawling counts as fishing.

name        = MicrobiologyExpansion_Milestone25
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_milestone_25
prestige    = 3
unique      = false
text        = Naturalist
description = 25 distinct microbial species catalogued. The codex is filling up nicely.

name        = MicrobiologyExpansion_Milestone50
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_milestone_50
prestige    = 5
unique      = false
text        = Master Naturalist
description = Every known microbial species catalogued. Someone needs to write more grants.

name        = MicrobiologyExpansion_AllBacteria
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_bacteria
prestige    = 4
unique      = false
text        = Bacteriologist
description = All known bacterial species catalogued. There are a lot of them. There are always a lot of them.

name        = MicrobiologyExpansion_AllArchaea
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_archaea
prestige    = 4
unique      = false
text        = Archaeologist
description = All known archaeal species catalogued. Not the digging kind of archaeologist, but arguably more impressive.

name        = MicrobiologyExpansion_AllFungi
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_fungi
prestige    = 3
unique      = false
text        = Mycologist
description = All known fungal species catalogued. The mycelial network approves.

name        = MicrobiologyExpansion_AllProtists
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_protists
prestige    = 3
unique      = false
text        = Protistologist
description = All known protist species catalogued. Five species. That's still a title, apparently.

name        = MicrobiologyExpansion_AllViruses
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_viruses
prestige    = 4
unique      = false
text        = Virologist
description = Both known viral species catalogued. Gene transferred this ribbon to himself. No one is sure how.

name        = MicrobiologyExpansion_AllSymbiotes
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_symbiotes
prestige    = 3
unique      = false
text        = Symbiologist
description = All known symbiotic species catalogued. They were already living inside us. We just finally noticed.

name        = MicrobiologyExpansion_AllParasites
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_parasites
prestige    = 3
unique      = false
text        = Parasitologist
description = All known parasitic species catalogued. The kerbal earning this ribbon is asked to please not bring samples home.

name        = MicrobiologyExpansion_FirstRisky
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_risky
prestige    = 3
unique      = false
text        = Hazmat Initiate
description = First confirmed discovery of a Risky-class microorganism. Quarantine protocols have been updated accordingly.

name        = MicrobiologyExpansion_FirstHazardous
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_first_hazardous
prestige    = 5
unique      = false
text        = Hazmat Specialist
description = First confirmed discovery of a Hazardous-class microorganism. Mission Control would like a word. Several words, actually.

name        = MicrobiologyExpansion_AllRisky
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_risky
prestige    = 4
unique      = false
text        = Risk Assessor
description = All Risky-class microorganisms catalogued. The safety board has reviewed this kerbal's file. The file is very thick.

name        = MicrobiologyExpansion_AllHazardous
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_all_hazardous
prestige    = 5
unique      = false
text        = Walking Biohazard
description = Both Hazardous-class microorganisms catalogued. This kerbal is no longer permitted within 50 metres of the cafeteria.

name        = MicrobiologyExpansion_Krakenitis
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_krakenitis
prestige    = 5
unique      = false
text        = Patient Zero
description = Discovered Krakenovirinae Kerbinii — the probable cause of Krakenitis. Wernher recommends Minmus ice cream as a treatment. The medical board does not endorse this.

name        = MicrobiologyExpansion_IceCreamBacteria
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_ice_cream
prestige    = 2
unique      = false
text        = Connoisseur
description = Discovered Vacuuma Minmii — the bacterium Bob insists tastes like ice cream. The sample was recovered slightly licked.

name        = MicrobiologyExpansion_Chlorinivorax
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_chlorinivorax
prestige    = 5
unique      = false
text        = Do Not Breathe
description = Discovered Chlorinivorax Tyloii. Toxic chlorine byproducts confirmed. The kerbal who found it has been placed in a very nice sealed room.

name        = MicrobiologyExpansion_Joolmoeba
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_joolmoeba
prestige    = 4
unique      = false
text        = Something Ate My Probe
description = Discovered Joolmoeba — the protist that preys on every other microbe in Jool's atmosphere. And apparently some of the probe hardware.

name        = MicrobiologyExpansion_HaliteDresii
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_halite
prestige    = 3
unique      = false
text        = Breakfast Seasoning
description = Discovered Halite Dresii. Valentina has already filed a patent application for Dres-brand table salt. Legal is looking into it.

name        = MicrobiologyExpansion_LithosilicusDresii
ribbon      = MicrobiologyExpansion/FinalFrontier/Ribbons/ribbon_lithosilicus
prestige    = 3
unique      = false
text        = It's Definitely Not a Rock
description = Discovered Lithosilicus Dresii. Jeb remains unconvinced. The sample has been growing for three weeks.